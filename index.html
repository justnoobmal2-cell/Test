<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7C5CFF">
<title>모두의 문제집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f7;--card:#fff;--line:#ececf0;--text:#1a1a1e;--muted:#8a8a93;
  --accent:#7C5CFF;--accent-soft:#efeaff;--ok:#1fb673;--bad:#ff5a5a;--nav-h:64px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:680px;margin:0 auto;background:var(--bg)}
.screens{flex:1;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;padding:0 0 32px}
.screen.on{display:block}
.screen::-webkit-scrollbar{width:0}

/* ---- generic ---- */
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{width:100%;height:54px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;transition:filter .15s,transform .1s}
.btn:active{filter:brightness(.92);transform:scale(.99)}
.btn:disabled{background:#d8d8de;color:#fff;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.pad{padding:0 18px}
.spacer{height:14px}

/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:12px;padding:18px 18px 8px;position:sticky;top:0;background:var(--bg);z-index:10}
.bar .x{margin-left:auto;font-size:26px;line-height:1;color:var(--muted);width:34px;height:34px;border-radius:50%}
.bar .x:active{background:var(--line)}
.bar .title{font-size:20px;font-weight:900}
.bar .timer{font-size:14px;font-weight:700;color:var(--muted);background:var(--card);padding:6px 12px;border-radius:20px;border:1px solid var(--line)}

/* ---- HOME ---- */
.hero{padding:30px 20px 14px}
.hero h1{font-size:26px;font-weight:900;line-height:1.3}
.hero p{color:var(--muted);font-size:14px;margin-top:6px}
.stat-row{display:flex;gap:10px;padding:8px 18px 20px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted)}
.sec{font-size:16px;font-weight:900;padding:6px 20px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;transition:transform .1s,box-shadow .15s}
.subj:active{transform:scale(.97)}
.subj .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.subj .nm{font-size:17px;font-weight:900}
.subj .ct{font-size:12px;color:var(--muted)}

/* ---- UNITS ---- */
.mode-row{display:flex;gap:10px;padding:6px 18px 18px}
.mode{flex:1;border:1.5px solid var(--line);border-radius:16px;padding:16px;background:var(--card);text-align:left}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode .mt{font-weight:900;font-size:15px}
.mode .ms{font-size:12px;color:var(--muted);margin-top:4px}
.ugroup{padding:0 18px 6px}
.ugroup-h{display:flex;align-items:center;gap:10px;padding:14px 2px 8px;font-weight:900;font-size:15px}
.topic{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.topic .cb{width:24px;height:24px;border-radius:8px;border:2px solid #cfcfd6;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:.12s}
.topic.on .cb{background:var(--accent);border-color:var(--accent)}
.topic .tn{font-size:14px;font-weight:500;flex:1}
.topic .tc{font-size:12px;color:var(--muted)}

/* ---- QUIZ ---- */
.q-meta{display:flex;gap:8px;align-items:center;padding:4px 20px 14px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.tag.diff{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.q-body{padding:0 20px;font-size:17px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}
.q-box{margin:16px 20px;padding:16px;border:1.5px solid var(--text);border-radius:12px;white-space:pre-wrap;font-size:15px;line-height:1.7}
.choices{padding:18px 18px 0;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;font-size:15px;font-weight:500;text-align:left}
.choice .num{width:26px;height:26px;border-radius:50%;border:1.5px solid #cfcfd6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .num{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.correct{border-color:var(--ok);background:#e8f8f0}
.choice.correct .num{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:#fdeaea}
.choice.wrong .num{background:var(--bad);border-color:var(--bad);color:#fff}
.ans-wrap{padding:20px}
.ans-in{width:100%;height:56px;border:1.5px solid var(--line);border-radius:14px;padding:0 18px;font-size:17px;font-family:inherit;font-weight:600;outline:none;background:var(--card)}
.ans-in:focus{border-color:var(--accent)}
.feedback{margin:0 20px;padding:16px;border-radius:14px;font-size:14px;line-height:1.7}
.feedback.ok{background:#e8f8f0;color:#0f7a4d}
.feedback.bad{background:#fdeaea;color:#c23a3a}
.feedback b{display:block;font-weight:900;margin-bottom:6px;font-size:15px}
.feedback .exp{color:var(--text);margin-top:8px;white-space:pre-wrap}
.q-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:14px 18px calc(14px + env(safe-area-inset-bottom))}

/* ---- RESULT ---- */
.res-top{text-align:center;padding:40px 20px 24px}
.res-top .big{font-size:30px;font-weight:900}
.res-top .em{font-size:54px}
.res-top .sub{color:var(--muted);margin-top:8px}
.res-top .em-num{color:var(--accent)}
.res-card{margin:6px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.res-line{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.res-line:last-child{border-bottom:none}
.res-line .l{font-size:14px;color:var(--muted)}
.res-line .r{font-size:16px;font-weight:900}

.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1a1a1e;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:.95}
</style>
</head>
<body>
<div id="app">
  <div class="screens">
    <!-- HOME -->
    <section class="screen on" id="s-home">
      <div class="hero">
        <h1 id="greet">오늘도 한 문제 풀어볼까요?</h1>
        <p>과목을 골라 바로 시작하세요</p>
      </div>
      <div class="stat-row">
        <div class="stat"><b id="st-solved">0</b><span>푼 문제</span></div>
        <div class="stat"><b id="st-acc">0%</b><span>정답률</span></div>
        <div class="stat"><b id="st-wrong">0</b><span>복습 대기</span></div>
      </div>
      <div class="sec">과목 선택</div>
      <div class="grid" id="subj-grid"></div>
      <div class="spacer"></div>
      <div class="pad"><button class="btn ghost" id="go-review">📌 틀린 문제 복습하기</button></div>
    </section>

    <!-- UNITS -->
    <section class="screen" id="s-units">
      <div class="bar">
        <div class="title" id="u-title">단원 선택</div>
        <button class="x" data-go="home">×</button>
      </div>
      <div class="mode-row">
        <button class="mode on"><div class="mt">직접 선택</div><div class="ms">원하는 단원을 골라요</div></button>
        <button class="mode" id="mode-all"><div class="mt">전체 풀기</div><div class="ms">모든 문제를 한번에</div></button>
      </div>
      <div id="unit-list"></div>
      <div class="spacer"></div>
      <div class="pad"><button class="btn" id="start-quiz">문제 풀기</button></div>
    </section>

    <!-- QUIZ -->
    <section class="screen" id="s-quiz">
      <div class="bar">
        <div class="title" id="q-idx">문제 1</div>
        <span class="timer" id="q-timer">00:00</span>
        <button class="x" data-go="home">×</button>
      </div>
      <div class="q-meta" id="q-meta"></div>
      <div class="q-body" id="q-text"></div>
      <div id="q-choices"></div>
      <div id="q-short"></div>
      <div id="q-feedback"></div>
      <div class="q-foot"><button class="btn" id="q-action">제출</button></div>
    </section>

    <!-- RESULT -->
    <section class="screen" id="s-result">
      <div class="bar"><button class="x" data-go="home">×</button></div>
      <div class="res-top">
        <div class="em">🎉</div>
        <div class="big">학습 완료!</div>
        <div class="sub"><span class="em-num" id="r-total">0</span>문제를 풀었어요</div>
      </div>
      <div class="res-card">
        <div class="res-line"><span class="l">⏱ 풀이 시간</span><span class="r" id="r-time">0초</span></div>
        <div class="res-line"><span class="l">✅ 맞힌 문제</span><span class="r" id="r-correct">0문제</span></div>
        <div class="res-line"><span class="l">📊 정답률</span><span class="r" id="r-acc">0%</span></div>
        <div class="res-line"><span class="l">📌 복습 추가</span><span class="r" id="r-added">0문제</span></div>
      </div>
      <div class="spacer"></div>
      <div class="pad" id="r-buttons"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUBJECTS_URL = "data/subjects.json";
const $ = s => document.querySelector(s);
const STORE = "studyapp.v1";

// ---------- persistent state ----------
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; }
}
function saveStore(d){ localStorage.setItem(STORE, JSON.stringify(d)); }
let store = loadStore();
store.stats = store.stats || { solved:0, correct:0, timeSec:0 };
store.wrong = store.wrong || [];   // ["subjId:qId", ...]
store.log   = store.log   || {};   // "subjId:qId" -> {correct:bool}

// ---------- runtime ----------
let subjects = [];
let subjData = {};       // subjId -> full data
let cur = null;          // {subjId, questions:[], idx, results:[], startedAt, qStart, answered}
let selectedTopics = new Set();
let allMode = false;

// ---------- helpers ----------
function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("#s-"+id).classList.add("on");
  $("#s-"+id).scrollTop = 0;
}
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g," "); }
function fmtTime(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return m>0 ? `${m}분 ${s}초` : `${s}초`;
}
function pad2(n){ return String(n).padStart(2,"0"); }
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1500);
}
function key(subjId,qId){ return subjId+":"+qId; }

// ---------- HOME ----------
function renderHome(){
  const s=store.stats;
  $("#st-solved").textContent = s.solved;
  $("#st-acc").textContent = s.solved ? Math.round(s.correct/s.solved*100)+"%" : "0%";
  $("#st-wrong").textContent = store.wrong.length;

  const grid=$("#subj-grid"); grid.innerHTML="";
  subjects.forEach(sub=>{
    const data=subjData[sub.id];
    const count = data ? data.questions.length : 0;
    const el=document.createElement("button");
    el.className="subj";
    el.innerHTML=`
      <div class="ic" style="background:${sub.color}1a;color:${sub.color}">${sub.icon}</div>
      <div class="nm">${sub.name}</div>
      <div class="ct">${count}문제</div>`;
    el.onclick=()=>openSubject(sub.id);
    grid.appendChild(el);
  });
}

// ---------- UNITS ----------
function openSubject(subjId){
  const data=subjData[subjId];
  if(!data){ toast("문제 데이터를 불러오지 못했어요"); return; }
  cur={ subjId };
  selectedTopics=new Set();
  allMode=false;
  $("#mode-all").classList.remove("on");
  document.querySelector(".mode").classList.add("on");
  $("#u-title").textContent = data.name + " · 단원 선택";

  // count per topic
  const counts={};
  data.questions.forEach(q=>{ counts[q.topic]=(counts[q.topic]||0)+1; });

  const list=$("#unit-list"); list.innerHTML="";
  data.units.forEach(g=>{
    const gd=document.createElement("div"); gd.className="ugroup";
    gd.innerHTML=`<div class="ugroup-h">${g.group}</div>`;
    g.topics.forEach(tp=>{
      const c=counts[tp]||0;
      const row=document.createElement("div");
      row.className="topic"+(c?"":" muted");
      row.innerHTML=`<div class="cb">✓</div><div class="tn">${tp}</div><div class="tc">${c}문제</div>`;
      row.onclick=()=>{
        if(allMode) return;
        if(selectedTopics.has(tp)) selectedTopics.delete(tp);
        else selectedTopics.add(tp);
        row.classList.toggle("on");
        updateStartBtn();
      };
      gd.appendChild(row);
    });
    list.appendChild(gd);
  });
  updateStartBtn();
  go("units");
}
function selectedQuestions(){
  const data=subjData[cur.subjId];
  if(allMode) return data.questions.slice();
  return data.questions.filter(q=>selectedTopics.has(q.topic));
}
function updateStartBtn(){
  const n=selectedQuestions().length;
  const b=$("#start-quiz");
  b.disabled = n===0;
  b.textContent = n? `${n}문제 풀기` : "단원을 선택하세요";
}
$("#mode-all").onclick=()=>{
  allMode=!allMode;
  $("#mode-all").classList.toggle("on",allMode);
  document.querySelector(".mode").classList.toggle("on",!allMode);
  document.querySelectorAll("#unit-list .topic").forEach(t=>t.classList.remove("on"));
  if(allMode) selectedTopics.clear();
  updateStartBtn();
};
$("#start-quiz").onclick=()=>{
  const qs=selectedQuestions();
  if(!qs.length) return;
  startQuiz(cur.subjId, qs, false);
};

// ---------- QUIZ ----------
let timerInt=null;
function startQuiz(subjId, questions, isReview){
  cur={ subjId, questions, idx:0, results:[], startedAt:Date.now(), answered:false, isReview };
  go("quiz");
  startTimer();
  renderQuestion();
}
function startTimer(){
  clearInterval(timerInt);
  cur.qStart=Date.now();
  timerInt=setInterval(()=>{
    const sec=Math.floor((Date.now()-cur.qStart)/1000);
    $("#q-timer").textContent=pad2(Math.floor(sec/60))+":"+pad2(sec%60);
  },500);
}
function renderQuestion(){
  cur.answered=false;
  cur.picked=null;
  const q=cur.questions[cur.idx];
  $("#q-idx").textContent=`문제 ${cur.idx+1} / ${cur.questions.length}`;
  startTimer();

  const meta=$("#q-meta"); meta.innerHTML="";
  if(q.difficulty) meta.innerHTML+=`<span class="tag diff">난이도 ${q.difficulty}</span>`;
  meta.innerHTML+=`<span class="tag">${q.topic}</span>`;
  (q.tags||[]).forEach(t=>meta.innerHTML+=`<span class="tag">${t}</span>`);

  $("#q-text").textContent=q.question;
  $("#q-feedback").innerHTML="";
  const ch=$("#q-choices"); ch.innerHTML="";
  const sh=$("#q-short"); sh.innerHTML="";

  if(q.type==="choice"){
    const wrap=document.createElement("div"); wrap.className="choices";
    q.choices.forEach((c,i)=>{
      const b=document.createElement("button");
      b.className="choice";
      b.innerHTML=`<span class="num">${i+1}</span><span>${c}</span>`;
      b.onclick=()=>{
        if(cur.answered) return;
        wrap.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel");
        cur.picked=c;
      };
      wrap.appendChild(b);
    });
    ch.appendChild(wrap);
  }else{
    sh.innerHTML=`<div class="ans-wrap"><input class="ans-in" id="ans-in" placeholder="답 입력" autocomplete="off"></div>`;
    $("#ans-in").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#q-action").click(); });
  }
  $("#q-action").textContent="제출";
}
$("#q-action").onclick=()=>{
  const q=cur.questions[cur.idx];
  if(!cur.answered){
    let given;
    if(q.type==="choice"){
      if(cur.picked==null){ toast("답을 선택하세요"); return; }
      given=cur.picked;
    }else{
      given=$("#ans-in").value;
      if(!norm(given)){ toast("답을 입력하세요"); return; }
    }
    grade(q, given);
  }else{
    nextQuestion();
  }
};
function grade(q, given){
  cur.answered=true;
  const correct = norm(given)===norm(q.answer);
  cur.results.push({ id:q.id, correct });

  // update persistent stats (skip stat double-count in review? we still count)
  store.stats.solved++;
  if(correct) store.stats.correct++;
  store.log[key(cur.subjId,q.id)] = { correct };
  const wkey=key(cur.subjId,q.id);
  if(correct){ store.wrong = store.wrong.filter(k=>k!==wkey); }
  else if(!store.wrong.includes(wkey)){ store.wrong.push(wkey); }
  saveStore(store);

  // visual feedback
  if(q.type==="choice"){
    document.querySelectorAll("#q-choices .choice").forEach(b=>{
      const txt=b.querySelector("span:last-child").textContent;
      if(norm(txt)===norm(q.answer)) b.classList.add("correct");
      else if(norm(txt)===norm(given)) b.classList.add("wrong");
      b.classList.remove("sel");
    });
  }else{
    $("#ans-in").disabled=true;
  }
  const fb=$("#q-feedback");
  fb.innerHTML=`<div class="feedback ${correct?'ok':'bad'}">
    <b>${correct?'정답이에요! 🎉':'아쉬워요 😢'}</b>
    정답: ${q.answer}
    ${q.explanation?`<div class="exp">💡 ${q.explanation}</div>`:''}
  </div>`;
  $("#q-action").textContent = (cur.idx+1<cur.questions.length)?"다음 문제":"결과 보기";
}
function nextQuestion(){
  if(cur.idx+1<cur.questions.length){ cur.idx++; renderQuestion(); $("#s-quiz").scrollTop=0; }
  else finishQuiz();
}
function finishQuiz(){
  clearInterval(timerInt);
  const total=cur.results.length;
  const correct=cur.results.filter(r=>r.correct).length;
  const timeSec=Math.floor((Date.now()-cur.startedAt)/1000);
  store.stats.timeSec+=timeSec; saveStore(store);
  const added=cur.results.filter(r=>!r.correct).length;

  $("#r-total").textContent=total;
  $("#r-time").textContent=fmtTime(timeSec);
  $("#r-correct").textContent=correct+"문제";
  $("#r-acc").textContent=total?Math.round(correct/total*100)+"%":"0%";
  $("#r-added").textContent=added+"문제";

  const bb=$("#r-buttons"); bb.innerHTML="";
  if(store.wrong.length){
    const r=document.createElement("button"); r.className="btn"; r.textContent="📌 틀린 문제 복습하기";
    r.onclick=startReview; bb.appendChild(r);
    bb.appendChild(Object.assign(document.createElement("div"),{className:"spacer"}));
  }
  const h=document.createElement("button"); h.className="btn ghost"; h.textContent="홈으로";
  h.onclick=()=>{ renderHome(); go("home"); }; bb.appendChild(h);
  go("result");
}

// ---------- REVIEW ----------
function startReview(){
  // gather wrong questions across subjects
  const qs=[];
  let subjId=null;
  store.wrong.forEach(k=>{
    const [sid,qid]=k.split(":");
    const data=subjData[sid];
    if(!data) return;
    const q=data.questions.find(x=>String(x.id)===qid);
    if(q){ qs.push(q); subjId=sid; }
  });
  if(!qs.length){ toast("복습할 문제가 없어요"); renderHome(); go("home"); return; }
  // mixed subjects: use first subject's id for keying is wrong — store per-question subj
  startReviewQuiz(qs);
}
function startReviewQuiz(items){
  // items: questions; we need subj per question -> rebuild from wrong keys
  const map=[];
  store.wrong.forEach(k=>{
    const [sid,qid]=k.split(":");
    const data=subjData[sid];
    const q=data&&data.questions.find(x=>String(x.id)===qid);
    if(q) map.push({sid,q});
  });
  cur={ subjId:null, questions:map.map(m=>m.q), _subj:map.map(m=>m.sid),
        idx:0, results:[], startedAt:Date.now(), answered:false, isReview:true };
  // patch grade to use per-question subject
  go("quiz"); startTimer(); renderQuestion();
}
$("#go-review").onclick=startReview;

// in review, subjId per question differs; override key lookup
const _grade=grade;
grade=function(q,given){
  if(cur.isReview && cur._subj){ cur.subjId=cur._subj[cur.idx]; }
  _grade(q,given);
};

// ---------- nav buttons ----------
document.querySelectorAll("[data-go]").forEach(b=>{
  b.onclick=()=>{ clearInterval(timerInt); renderHome(); go(b.dataset.go); };
});

// ---------- greeting ----------
(function(){
  const h=new Date().getHours();
  const g = h<6?"새벽까지 고생이 많아요 🌙" : h<12?"좋은 아침이에요 ☀️" : h<18?"오후도 화이팅이에요 ✏️" : "오늘 하루 마무리 잘해요 🌆";
  $("#greet").textContent=g;
})();

// ---------- boot ----------
async function boot(){
  try{
    const sm=await fetch(SUBJECTS_URL).then(r=>r.json());
    subjects=sm.subjects;
    await Promise.all(subjects.map(async s=>{
      try{ subjData[s.id]=await fetch("data/"+s.file).then(r=>r.json()); }
      catch(e){ console.warn("load fail",s.file,e); }
    }));
    renderHome();
  }catch(e){
    $("#subj-grid").innerHTML=`<div class="empty">데이터를 불러오지 못했어요.<br>GitHub Pages 또는 로컬 서버로 열어주세요.<br><small>${e}</small></div>`;
  }
}
boot();
</script>
